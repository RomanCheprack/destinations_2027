<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח היעדים 2027 | בוץ הרפתקאות</title>
<meta name="description" content="באילו חודשים יוצאים לכל יעד ב-2027 – טיולי אופניים, הליכה ומשפחות עם בוץ הרפתקאות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#3b2a1d; --ink:#2a211a; --muted:#6e6157; --paper:#ffffff; --sand:#f3efe9;
  --sky:#3fb0cf; --orange:#e9772b; --teal:#1d3a41; --line:#e3ddd5; --off:#ece7e0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --brown:#e9dccd; --ink:#f2ece5; --muted:#b5a99d; --paper:#1a1512; --sand:#231d18;
    --sky:#5cc3df; --orange:#f0893f; --teal:#10262b; --line:#3a312a; --off:#2e2620;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Assistant",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

header{background:var(--sand);padding:36px 0 28px;border-bottom:4px solid var(--sky)}
.brand{font-weight:700;color:var(--brown);margin:0 0 6px}
h1{font-family:"Karantina","Assistant",sans-serif;font-size:clamp(64px,17vw,112px);line-height:.85;margin:0;color:var(--brown);letter-spacing:.5px}
h1 span{display:block;color:var(--sky)}
.lead{margin:14px 0 0;color:var(--muted);max-width:34em}

.filters{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 0 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:4px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 15px "Assistant",sans-serif;padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:var(--paper)}
.chip:focus-visible,.wa:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.count{font-size:14px;color:var(--muted);margin:6px 2px 0}

main{padding:8px 0 40px}
.dest{padding:20px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flag{width:36px;height:27px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.dest h2{font-family:"Karantina","Assistant",sans-serif;font-size:40px;line-height:1;margin:0;color:var(--brown)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none;margin-inline-start:auto}
.acts li{font-size:14px;background:var(--off);border-radius:6px;padding:2px 8px;color:var(--ink)}

.bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:14px 0 8px}
.bar span{font-size:11px;text-align:center;padding:7px 0;border-radius:4px;background:var(--off);color:var(--muted)}
.bar span.on{background:var(--orange);color:#fff;font-weight:700}
.bar.tbd span{background:transparent;border:1.5px dashed var(--line)}
.bar span.hl{box-shadow:0 0 0 2px var(--brown) inset}

.when{margin:0;font-weight:600}
.when.tbd{color:var(--muted);font-weight:400}
.wa{display:inline-block;margin-top:10px;color:var(--teal);font-weight:700;text-decoration:none;border-bottom:2px solid var(--sky)}
@media (prefers-color-scheme:dark){.wa{color:var(--sky)}}
.empty{padding:40px 0;color:var(--muted)}

footer{background:var(--teal);color:#fff;padding:28px 0 32px}
footer p{margin:4px 0}
footer a{color:#fff}
.cta{display:inline-block;margin:12px 0 14px;background:var(--orange);color:#fff;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.dest{transition:opacity .2s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="brand">בוץ הרפתקאות, 20 שנה של הרפתקאות</p>
    <h1>לוח היעדים <span>2027</span></h1>
    <p class="lead">באילו חודשים יוצאים לכל יעד. בחרו פעילות או חודש, ותראו מה מתאים לכם.</p>
  </div>
</header>

<nav class="filters" aria-label="סינון">
  <div class="wrap">
    <div class="row" id="actRow" role="group" aria-label="סוג פעילות"></div>
    <div class="row" id="monthRow" role="group" aria-label="חודש"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </div>
</nav>

<main class="wrap" id="list"></main>

<footer>
  <div class="wrap">
    <a class="cta" id="mainWa" href="#">דברו איתנו בוואטסאפ</a>
    <p>בוץ הרפתקאות | קיבוץ רמות מנשה</p>
    <p><a href="tel:0747010710">074-7010710</a> | <a href="mailto:reserve@botz-adventures.co.il">reserve@botz-adventures.co.il</a></p>
    <p><a href="https://www.botz-adventures.co.il">www.botz-adventures.co.il</a></p>
  </div>
</footer>

<script>
/* ===== לעריכה: מספר וואטסאפ ויעדים =====
   m = החודשים שבהם יוצאים (1 = ינואר ... 12 = דצמבר)
   m: null = עוד לא ידוע, יוצג "יעודכן בקרוב" */
const WA = "972552672295";

const ACTS = {
  bike:"🚲 אופניים", hike:"🥾 הייקינג", touring:"🏔️ טורינג",
  mushroom:"🍄 ליקוט פטריות", yoga:"🧘 יוגה", family:"👨‍👩‍👧 משפחות"
};

const DESTS = [
  {n:"אוסטריה", f:"at", a:["bike","touring","yoga"], m:[4,5,6,7,9,10]},
  {n:"איטליה", f:"it", a:["bike","hike"], m:[4,5,6,7,9,10]},
  {n:"אלבניה", f:"al", a:["bike"], m:[4,5,6,9,10]},
  {n:"בולגריה", f:"bg", a:["bike","hike","mushroom","yoga","family"], m:[4,5,6,7,8,9,10]},
  {n:"גיאורגיה", f:"ge", a:["bike","hike","family"], m:[5,6,7,8,9,10]},
  {n:"וייטנאם", f:"vn", a:["bike"], m:[2,12]},
  {n:"טנזניה", f:"tz", a:["bike","hike"], m:null},
  {n:"יוון", f:"gr", a:["bike","hike","family","yoga"], m:[4,5,6,7,9,10]},
  {n:"יפן", f:"jp", a:["bike"], m:null},
  {n:"מדירה", sub:"פורטוגל", f:"pt", a:["bike"], m:[2,3,4,6,11,12]},
  {n:"מונטנגרו", f:"me", a:["bike","hike","mushroom","family"], m:[4,5,6,7,8,9,10]},
  {n:"מרוקו", f:"ma", a:["bike","hike"], m:[2,3,4,5,9,10]},
  {n:"סין", f:"cn", a:["bike"], m:null},
  {n:"סלובניה", f:"si", a:["bike","hike"], m:[4,5,6,9,10]},
  {n:"סרי לנקה", f:"lk", a:["bike"], m:[1,2,11,12]},
  {n:"קניה", f:"ke", a:["bike"], m:null},
  {n:"קרואטיה", f:"hr", a:["bike","hike"], m:null},
  {n:"שוויץ", f:"ch", a:["yoga"], m:[6,9]}
];
/* ===== סוף אזור העריכה ===== */

const SHORT = ["ינו","פבר","מרץ","אפר","מאי","יוני","יולי","אוג","ספט","אוק","נוב","דצמ"];
const FULL = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const state = {act:null, month:null};

const waLink = t => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;

function ranges(ms){
  const s = new Set(ms); const out = []; const seen = new Set();
  // start a range at a month whose previous month (circular) is not included
  const starts = ms.filter(x => !s.has(x === 1 ? 12 : x - 1));
  if (!starts.length) return "כל השנה";
  starts.sort((a,b)=>a-b).forEach(st => {
    let e = st; seen.add(st);
    while (s.has(e === 12 ? 1 : e + 1) && !seen.has(e === 12 ? 1 : e + 1)) { e = e === 12 ? 1 : e + 1; seen.add(e); }
    out.push(st === e ? FULL[st-1] : `${FULL[st-1]}–${FULL[e-1]}`);
  });
  return out.join(", ");
}

function chip(label, pressed, onClick){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = label;
  b.setAttribute("aria-pressed", pressed);
  b.addEventListener("click", onClick);
  return b;
}

function renderFilters(){
  const ar = document.getElementById("actRow"); ar.innerHTML = "";
  ar.append(chip("כל הפעילויות", state.act === null, () => { state.act = null; render(); }));
  Object.entries(ACTS).forEach(([k,v]) =>
    ar.append(chip(v, state.act === k, () => { state.act = state.act === k ? null : k; render(); })));
  const mr = document.getElementById("monthRow"); mr.innerHTML = "";
  mr.append(chip("כל החודשים", state.month === null, () => { state.month = null; render(); }));
  FULL.forEach((name,i) =>
    mr.append(chip(name, state.month === i+1, () => { state.month = state.month === i+1 ? null : i+1; render(); })));
}

function renderList(){
  const list = document.getElementById("list"); list.innerHTML = "";
  const shown = DESTS.filter(d =>
    (!state.act || d.a.includes(state.act)) &&
    (!state.month || (d.m && d.m.includes(state.month))));
  document.getElementById("count").textContent =
    shown.length === DESTS.length ? `${DESTS.length} יעדים` : `${shown.length} מתוך ${DESTS.length} יעדים`;

  if (!shown.length){
    list.innerHTML = `<p class="empty">אין יעד שמתאים לשני הסינונים יחד. נסו חודש אחר, או <a href="${waLink("היי, מחפש טיול ושאלה לגבי תאריכים")}">שאלו אותנו בוואטסאפ</a>.</p>`;
    return;
  }
  shown.forEach(d => {
    const el = document.createElement("article"); el.className = "dest";
    const bar = SHORT.map((s,i) => {
      const on = d.m && d.m.includes(i+1);
      const hl = state.month === i+1;
      return `<span class="${on ? "on" : ""}${hl ? " hl" : ""}">${s}</span>`;
    }).join("");
    const when = d.m ? ranges(d.m) : "החודשים יעודכנו בקרוב";
    el.innerHTML = `
      <div class="top">
        <img class="flag" src="https://flagcdn.com/w80/${d.f}.png" alt="" width="36" height="27" loading="lazy">
        <h2>${d.n}${d.sub ? ` <small style="font-size:.55em;color:var(--muted)">${d.sub}</small>` : ""}</h2>
        <ul class="acts">${d.a.map(k => `<li>${ACTS[k]}</li>`).join("")}</ul>
      </div>
      <div class="bar${d.m ? "" : " tbd"}" aria-hidden="true">${bar}</div>
      <p class="when${d.m ? "" : " tbd"}">${d.m ? "יוצאים ב" : ""}${when}</p>
      <a class="wa" href="${waLink(`היי, מתעניין בטיול ל${d.n}`)}">שאלו על ${d.n} בוואטסאפ</a>`;
    list.append(el);
  });
}

function render(){ renderFilters(); renderList(); }
document.getElementById("mainWa").href = waLink("היי, ראיתי את לוח היעדים 2027 ויש לי שאלה");
render();
</script>
</body>
</html>
